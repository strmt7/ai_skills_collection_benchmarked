# Main-only maintenance: no automated version-update branches or PRs.
# Vulnerability alerts stay enabled; qualify and apply updates directly on main.
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/toolchains/appcontainer-modern"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "UTC"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/toolchains/cocoindex-code"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    groups:
      cocoindex-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/toolchains/pptx-native"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "UTC"
    groups:
      pptx-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/included/improved/skills/cover-image-workflow-current/assets"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "UTC"
    groups:
      image-cli-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/benchmarks/component-controls/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "UTC"
    groups:
      frontend-controls-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/toolchains/crawl4ai"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "UTC"
    groups:
      crawl4ai-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "UTC"
    groups:
      pip-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 0
