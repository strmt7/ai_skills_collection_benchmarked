name: Azure Event Hubs Python checkpoint controls

on:
  push:
    paths:
      - 'included/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-py/**'
      - 'included/repaired/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-python-checkpoint/**'
      - 'artifacts/repaired-skill-readiness/azure-eventhub-python-checkpoint-v1/**'
      - 'tests/test_azure_eventhub_python.py'
      - '.github/workflows/azure-eventhub-python.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * 3'

concurrency:
  group: azure-eventhub-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkpoint:
    name: Offline checkpoint controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Install tested package snapshot
        run: |
          python -m pip install -r included/repaired/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-python-checkpoint/examples/requirements-test.txt
          python -m pip check
      - name: Run offline checkpoint controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $env:RUNNER_TEMP 'eventhub-python-result.json'
          python artifacts/repaired-skill-readiness/azure-eventhub-python-checkpoint-v1/reproduce.py > $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain control observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-eventhub-python-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/eventhub-python-result.json
          if-no-files-found: warn
          retention-days: 14
