name: Ruff

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install locked developer environment
        run: |
          uv venv --python "$(command -v python)" .venv
          .venv/bin/python tools/verify_dev_lock.py --json
          uv pip sync --python .venv/bin/python --require-hashes --only-binary=:all: requirements-dev-lock.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
          uv pip check --python .venv/bin/python
      - name: Test developer lock verification
        env:
          AI_SKILLS_REQUIRE_UV: "1"
        run: .venv/bin/python -m pytest -q -o addopts= tests/test_verify_dev_lock.py
      - name: ruff check
        run: .venv/bin/python -m ruff check tools tests benchmarks/agent-effectiveness/graders
      - name: ruff format --check
        run: .venv/bin/python -m ruff format --check tools tests benchmarks/agent-effectiveness/graders
