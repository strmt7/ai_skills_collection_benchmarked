name: Ruff

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install lint extras
        run: python -m pip install --upgrade pip && python -m pip install -e '.[lint]'
      - name: ruff check
        run: ruff check tools tests benchmarks/agent-effectiveness/graders
      - name: ruff format --check
        run: ruff format --check tools tests benchmarks/agent-effectiveness/graders
