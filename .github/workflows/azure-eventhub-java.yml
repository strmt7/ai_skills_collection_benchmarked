name: Azure Event Hubs Java batching controls

on:
  push:
    paths:
      - 'included/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-java/**'
      - 'included/repaired/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-java-batching/**'
      - 'artifacts/repaired-skill-readiness/azure-eventhub-java-batching-v1/**'
      - 'tests/test_azure_eventhub_java.py'
      - '.github/workflows/azure-eventhub-java.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 3'

concurrency:
  group: azure-eventhub-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Java batching controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            jdk_asset: OpenJDK27U-jdk_x64_linux_hotspot_27_35.tar.gz
            jdk_sha256: 1cf69a4848ffb728b3b260dfd45206a51566ab571a02a30092271d4c580bccbc
          - os: windows-latest
            jdk_asset: OpenJDK27U-jdk_x64_windows_hotspot_27_35.zip
            jdk_sha256: 2031c9c5c624737ed29a0624caaf5bcc25e74235834c28b4bfa88f7ba7a40e4a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - name: Install qualified JDK and Maven
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JDK_ASSET: ${{ matrix.jdk_asset }}
          JDK_SHA256: ${{ matrix.jdk_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'eventhub-java-tools'
          New-Item -ItemType Directory -Path $downloads | Out-Null
          gh release download 'jdk-27+35' --repo adoptium/temurin27-binaries --pattern $env:JDK_ASSET --dir $downloads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $jdkArchive = Join-Path $downloads $env:JDK_ASSET
          if ((Get-FileHash -LiteralPath $jdkArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:JDK_SHA256) { throw 'JDK release digest mismatch' }
          $jdkDirectory = Join-Path $downloads 'jdk'
          New-Item -ItemType Directory -Path $jdkDirectory | Out-Null
          if ($IsWindows) { Expand-Archive -LiteralPath $jdkArchive -DestinationPath $jdkDirectory }
          else { tar -xzf $jdkArchive -C $jdkDirectory; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $mavenArchive = Join-Path $downloads 'maven.zip'
          Invoke-WebRequest -Uri 'https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.zip' -OutFile $mavenArchive -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $mavenArchive -Algorithm SHA512).Hash.ToLowerInvariant() -ne '22d31676d5b92ed53308c19ecded3245d0efd0cddfec51ec7bab62f4f13ad70ddddceff8e62940e0e8e2421f3cde8106737f4becec0aa034ffeff2a754e88337') { throw 'Maven release digest mismatch' }
          Expand-Archive -LiteralPath $mavenArchive -DestinationPath (Join-Path $downloads 'maven')
      - name: Run isolated SDK batch controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:RUNNER_TEMP 'eventhub-java-tools'
          $javaHome = Join-Path $downloads 'jdk/jdk-27+35'
          $maven = Join-Path $downloads 'maven/apache-maven-3.10.0/bin/mvn'
          if ($IsWindows) { $maven += '.cmd' } else { chmod +x $maven; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $pwsh = (Get-Command pwsh).Source
          python artifacts/repaired-skill-readiness/azure-eventhub-java-batching-v1/reproduce.py --maven $maven --java-home $javaHome --pwsh $pwsh --java-major 27 --output (Join-Path $env:RUNNER_TEMP 'eventhub-java-controls')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain component observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-eventhub-java-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/eventhub-java-controls
          if-no-files-found: warn
          retention-days: 14
