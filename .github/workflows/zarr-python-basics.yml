name: Zarr Python component controls

on:
  push:
    paths:
      - 'included/skills/by-category/science-research-data-analysis/latest-release-community/zarr-python/**'
      - 'included/repaired/skills/by-category/science-research-data-analysis/latest-release-community/zarr-python-basics/**'
      - 'artifacts/repaired-skill-readiness/zarr-python-basics-v1/**'
      - '.github/workflows/zarr-python-basics.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * 2'

concurrency:
  group: zarr-python-basics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selected-api-controls:
    name: Zarr selected API examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.16'
            requirements: requirements-linux.txt
          - os: windows-latest
            python: '3.13.18'
            requirements: requirements-windows.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python }}
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/zarr-controls-venv
          enable-cache: 'false'
      - name: Install the pinned dependency graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv pip install --require-hashes --only-binary=:all: -r "artifacts/repaired-skill-readiness/zarr-python-basics-v1/${{ matrix.requirements }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected API controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifacts/repaired-skill-readiness/zarr-python-basics-v1/control.py > "$env:RUNNER_TEMP/zarr-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python artifacts/repaired-skill-readiness/zarr-python-basics-v1/reference-control.py > "$env:RUNNER_TEMP/zarr-reference-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zarr-controls-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/zarr-result.json
            ${{ runner.temp }}/zarr-reference-result.json
          if-no-files-found: error
          retention-days: 14
