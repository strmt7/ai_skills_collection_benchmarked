name: JavaScript documentation inventory controls

on:
  push:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/reddit-verified-gtm-registry/docs-from-code/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/reddit-verified-gtm-registry/docs-from-code-js-inventory/**'
      - 'artifacts/repaired-skill-readiness/docs-from-code-js-inventory-v1/**'
      - 'tests/test_docs_js_inventory_evidence.py'
      - '.github/workflows/docs-js-inventory.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 4'

concurrency:
  group: docs-js-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Source and framework controls (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      EXPECTED_NODE: ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.2', '26.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.18'
      - name: Exercise the inventory and real framework fixtures
        shell: pwsh
        run: |
          if ((node --version) -ne "v$env:EXPECTED_NODE") { throw 'Unexpected Node version' }
          python artifacts/repaired-skill-readiness/docs-from-code-js-inventory-v1/reproduce.py --output (Join-Path $env:RUNNER_TEMP 'docs-js-inventory')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-js-inventory-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/docs-js-inventory/
          if-no-files-found: error
          retention-days: 14
