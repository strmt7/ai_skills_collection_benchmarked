name: Azure Event Hubs TypeScript checkpoint controls

on:
  push:
    paths:
      - 'included/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-ts/**'
      - 'included/repaired/skills/by-category/cloud-azure-microsoft-sdks/official-vendor-reference/azure-eventhub-ts-checkpoint/**'
      - 'artifacts/repaired-skill-readiness/azure-eventhub-ts-checkpoint-v1/**'
      - 'tests/test_azure_eventhub_ts_checkpoint.py'
      - '.github/workflows/azure-eventhub-ts-checkpoint.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * 3'

concurrency:
  group: azure-eventhub-ts-checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Offline checkpoint callbacks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Compile and exercise the callbacks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $node = (Get-Command node).Source
          $nodeDir = Split-Path -Parent $node
          $candidates = @(
            (Join-Path $nodeDir 'node_modules/npm/bin/npm-cli.js'),
            (Join-Path $nodeDir '../lib/node_modules/npm/bin/npm-cli.js')
          )
          $npm = @($candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if ($npm.Count -ne 1) { throw 'Bundled npm CLI was not found beside Node' }
          python artifacts/repaired-skill-readiness/azure-eventhub-ts-checkpoint-v1/reproduce.py --node $node --npm-cli $npm[0] --output (Join-Path $env:RUNNER_TEMP 'eventhub-ts-checkpoint')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain offline observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-eventhub-ts-checkpoint-${{ matrix.os }}
          path: ${{ runner.temp }}/eventhub-ts-checkpoint/
          if-no-files-found: error
          retention-days: 14
