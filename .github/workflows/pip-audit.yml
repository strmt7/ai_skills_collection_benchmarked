name: pip-audit

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily CVE scan in case a transitive dep advisory drops between commits.
  schedule:
    - cron: "15 6 * * *"

concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[security]'

      - name: Audit validation and report dependency graphs
        run: pip-audit --strict --requirement requirements-lock.txt --requirement requirements-reports-lock.txt

      - name: Audit all pinned Crawl4AI runtime and build records
        # Native hash installs + pip check in crawl4ai-provider.yml prove graph
        # completeness on Windows CPython 3.13.17. Audit their exact public
        # coordinates here without attempting Linux installation of Windows wheels.
        run: >-
          pip-audit --strict --disable-pip --no-deps
          --requirement toolchains/crawl4ai/requirements.txt
          --requirement toolchains/crawl4ai/requirements-build.txt
          --requirement toolchains/crawl4ai/requirements-bootstrap.txt

      - name: Audit the complete Windows PPTX consumer graph
        run: >-
          pip-audit --strict --disable-pip --no-deps
          --requirement toolchains/pptx-native/requirements.txt

      - name: Audit the confined grader dependency graph
        run: >-
          pip-audit --strict --disable-pip --no-deps
          --requirement toolchains/appcontainer-modern/requirements.txt

      - name: Audit the local-only CocoIndex runtime coordinates
        # The native workflow installs the admitted downstream wheel normally.
        # Keep its upstream advisory identity and every actual runtime coordinate.
        run: >-
          pip-audit --strict --disable-pip --no-deps
          --requirement toolchains/cocoindex-code/requirements.txt

      - name: Audit the separate CocoIndex build and bootstrap graph
        # Runtime and build intentionally use different pathspec versions.
        # The build graph also includes the exact bootstrap pip coordinate.
        run: >-
          pip-audit --strict --disable-pip --no-deps
          --requirement toolchains/cocoindex-code/requirements-build.txt

  lock-consistency:
    # pip-tools locks one environment, not a universal cross-platform graph.
    # Its seeded consistency is verified on Windows with Python 3.14.9;
    # Linux audits the locked package graph above.
    runs-on: windows-latest
    # Apply before checkout; configuring Git in a later step is too late.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt
      - name: Install hashed validation environment
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify seeded lock against project requirements
        run: python tools/verify_dependency_lock.py --json
      - name: Verify seeded report lock against report requirements
        run: python tools/verify_dependency_lock.py --lock requirements-reports-lock.txt --extra reports --json
