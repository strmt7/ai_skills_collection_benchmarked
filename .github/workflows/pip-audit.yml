name: pip-audit

on:
  push:
  pull_request:
  workflow_dispatch:
  # Daily CVE scan in case a transitive dep advisory drops between commits.
  schedule:
    - cron: "15 6 * * *"

concurrency:
  group: pip-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[security]'

      - name: Audit pyproject (all extras)
        run: pip-audit --strict --requirement requirements-lock.txt

  lock-consistency:
    # pip-tools locks one environment, not a universal cross-platform graph.
    # Its seeded consistency is verified on Windows with Python 3.14.8;
    # Linux audits the locked package graph above.
    runs-on: windows-latest
    # Apply before checkout; configuring Git in a later step is too late.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt
      - name: Install hashed validation environment
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify seeded lock against project requirements
        run: python tools/verify_dependency_lock.py --json
