name: Mypy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mypy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin mypy's --python-version to each supported runtime so any
        # version-conditional type errors (e.g. datetime.UTC, PEP 695 syntax)
        # surface here instead of in production.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.11"
            runtime: "3.11.17"
          - python-version: "3.12"
            runtime: "3.12.15"
          - python-version: "3.13"
            runtime: "3.13.16"
          - python-version: "3.14"
            runtime: "3.14.8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.runtime }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install lint + test extras
        run: python -m pip install --upgrade pip && python -m pip install -e '.[lint,test]'
      - name: mypy
        run: mypy --python-version ${{ matrix.python-version }} tools tests benchmarks/agent-effectiveness/graders
