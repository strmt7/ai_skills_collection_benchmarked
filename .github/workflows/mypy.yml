name: Mypy

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: mypy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin mypy's --python-version to each supported runtime so any
        # version-conditional type errors (e.g. datetime.UTC, PEP 695 syntax)
        # surface here instead of in production.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.11"
            runtime: "3.11.18"
          - python-version: "3.12"
            runtime: "3.12.16"
          - python-version: "3.13"
            runtime: "3.13.18"
          - python-version: "3.14"
            runtime: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.runtime }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install locked developer environment
        run: |
          uv venv --python "$(command -v python)" .venv
          .venv/bin/python tools/verify_dev_lock.py --json
          uv pip sync --python .venv/bin/python --require-hashes --only-binary=:all: requirements-dev-lock.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
          uv pip check --python .venv/bin/python
      - name: mypy
        run: .venv/bin/python -m mypy --python-version ${{ matrix.python-version }} tools tests benchmarks/agent-effectiveness/graders
