name: FlowIO FCS component controls

on:
  push:
    paths:
      - 'included/skills/by-category/science-research-data-analysis/latest-release-community/flowio/**'
      - 'included/repaired/skills/by-category/science-research-data-analysis/latest-release-community/flowio-fcs-basics/**'
      - 'artifacts/repaired-skill-readiness/flowio-fcs-basics-v1/**'
      - '.github/workflows/flowio-controls.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '50 8 * * 2'

concurrency:
  group: flowio-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Selected FCS controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      SOURCE_DATE_EPOCH: '1704067200'
      PYTHONHASHSEED: '0'
      UV_NO_CACHE: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.16'
            requirements: requirements-linux.txt
          - os: windows-latest
            python: '3.13.18'
            requirements: requirements-windows.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/flowio-controls-venv
          enable-cache: 'false'
      - name: Install pinned build and runtime graphs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv pip install --require-hashes --only-binary=:all: -r artifacts/repaired-skill-readiness/flowio-fcs-basics-v1/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --require-hashes --no-build-isolation -r "artifacts/repaired-skill-readiness/flowio-fcs-basics-v1/${{ matrix.requirements }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch the exact public tutorial fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifacts/repaired-skill-readiness/flowio-fcs-basics-v1/fetch_fixture.py --output "$env:RUNNER_TEMP/flowio-example.fcs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selected FCS component controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python artifacts/repaired-skill-readiness/flowio-fcs-basics-v1/reproduce.py --fixture "$env:RUNNER_TEMP/flowio-example.fcs" > "$env:RUNNER_TEMP/flowio-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flowio-fcs-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/flowio-result.json
          if-no-files-found: error
          retention-days: 14
