name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "35 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # github/codeql-action v4, resolved to this commit on 2026-10-25.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: codeql-init
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Qualify defusedxml path models
        if: matrix.language == 'python'
        env:
          CODEQL_BIN: ${{ steps.codeql-init.outputs.codeql-path }}
        run: >-
          python tools/qualify_defusedxml_codeql_model.py
          --codeql "$CODEQL_BIN" --model .github/codeql/extensions/defusedxml-paths
          --output "$RUNNER_TEMP/defusedxml-model-control"
      - name: Retain model control evidence
        if: always() && matrix.language == 'python'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-defusedxml-model-control-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/defusedxml-model-control/*.sarif
            ${{ runner.temp }}/defusedxml-model-control/*.log
            ${{ runner.temp }}/defusedxml-model-control/receipt.json
            ${{ runner.temp }}/defusedxml-model-control/fixture/fixture.py
          if-no-files-found: error
      # Scan mirrors and evidence too; no path or finding suppression.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        id: codeql-analysis
        with:
          category: /language:${{ matrix.language }}
      - name: Verify model was loaded in repository analysis
        if: matrix.language == 'python'
        env:
          SARIF_DIR: ${{ steps.codeql-analysis.outputs.sarif-output }}
        run: python tools/qualify_defusedxml_codeql_model.py --analysis-dir "$SARIF_DIR"

  alert-budget:
    name: Open code-scanning alert budget
    needs: analyze
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require no more than two open alerts on the analyzed main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_code_scanning_alerts.py --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
