name: SimPO verifier task calibration

on:
  push:
    paths:
      - 'benchmarks/agent-effectiveness/development/simpo-verifier-v1/**'
      - 'benchmarks/component-controls/simpo-postrun/requirements-*.txt'
      - '.github/workflows/simpo-verifier-task.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '40 8 * * 3'

concurrency:
  group: simpo-verifier-task-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Known-control calibration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            requirements: requirements-linux.txt
          - os: windows-latest
            requirements: requirements-windows.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: '3.13.18'
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/simpo-task-calibration-venv
          enable-cache: 'false'
      - name: Install the pinned control dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import platform,sys; sys.exit(platform.python_version() != '3.13.18' or sys.prefix == sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --require-hashes --only-binary=:all: -r "benchmarks/component-controls/simpo-postrun/${{ matrix.requirements }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate only the checked-in controls
        shell: pwsh
        run: |
          python benchmarks/agent-effectiveness/development/simpo-verifier-v1/controls/calibrate.py --output (Join-Path $env:RUNNER_TEMP 'simpo-task-calibration')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Calibrate asymmetric tolerance controls
        shell: pwsh
        run: |
          python benchmarks/agent-effectiveness/development/simpo-verifier-v1/controls/calibrate_tolerance_direction.py --output (Join-Path $env:RUNNER_TEMP 'simpo-tolerance-calibration')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpo-task-calibration-${{ matrix.os }}
          path: ${{ runner.temp }}/simpo-task-calibration/
          if-no-files-found: error
          retention-days: 14
      - name: Retain tolerance control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simpo-tolerance-calibration-${{ matrix.os }}
          path: ${{ runner.temp }}/simpo-tolerance-calibration/
          if-no-files-found: error
          retention-days: 14
