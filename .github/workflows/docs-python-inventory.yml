name: Python documentation inventory controls

on:
  push:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/reddit-verified-gtm-registry/docs-from-code/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/reddit-verified-gtm-registry/docs-from-code-python-inventory/**'
      - 'artifacts/repaired-skill-readiness/docs-from-code-python-inventory-v1/**'
      - 'tests/test_docs_python_inventory_evidence.py'
      - '.github/workflows/docs-python-inventory.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '10 7 * * 4'

concurrency:
  group: docs-python-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Source and framework controls (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      EXPECTED_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11.18', '3.12.16', '3.13.18', '3.14.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/docs-python-inventory-venv
          enable-cache: 'false'
      - name: Install the pinned test graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import os,platform,sys; sys.exit(platform.python_version() != os.environ['EXPECTED_PYTHON'] or sys.prefix == sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $platform = if ($IsWindows) { 'windows' } else { 'linux' }
          uv pip install --require-hashes --only-binary=:all: -r "artifacts/repaired-skill-readiness/docs-from-code-python-inventory-v1/requirements-$platform.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the inventory and real framework fixtures
        shell: pwsh
        run: |
          python artifacts/repaired-skill-readiness/docs-from-code-python-inventory-v1/reproduce.py --output (Join-Path $env:RUNNER_TEMP 'docs-python-inventory')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain test observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-python-inventory-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/docs-python-inventory/
          if-no-files-found: error
          retention-days: 14
