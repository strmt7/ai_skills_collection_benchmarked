name: Slides navigation compatibility

on:
  push:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'artifacts/repaired-skill-readiness/slides-navigation-v1/**'
      - '.github/workflows/slides-navigation.yml'
      - '.gitattributes'
      - 'tests/test_slides_navigation_repair.py'
  pull_request:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'artifacts/repaired-skill-readiness/slides-navigation-v1/**'
      - '.github/workflows/slides-navigation.yml'
      - '.gitattributes'
      - 'tests/test_slides_navigation_repair.py'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'

concurrency:
  group: slides-navigation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-controls:
    name: Slide controls (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      SECONDARY_BROWSER: ${{ matrix.secondary }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.2', '26.13.0']
        include:
          - os: ubuntu-latest
            secondary: firefox
          - os: windows-latest
            secondary: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned controls and exercise real browsers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = 'artifacts/repaired-skill-readiness/slides-navigation-v1'
          $bootstrap = Join-Path $env:RUNNER_TEMP 'slides-npm'
          $controls = Join-Path $env:RUNNER_TEMP 'slides-controls'
          $results = Join-Path $env:RUNNER_TEMP 'slides-results'
          New-Item -ItemType Directory -Path $bootstrap, $controls, $results | Out-Null
          Copy-Item "$evidence/npm-bootstrap/package*.json" -Destination $bootstrap
          Copy-Item "$evidence/dependencies/package*.json" -Destination $controls
          npm ci --prefix $bootstrap --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npm = Join-Path $bootstrap 'node_modules/npm/bin/npm-cli.js'
          $version = & node $npm --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '12.2.1') { throw 'Unexpected npm version' }
          & node $npm ci --prefix $controls --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $playwright = Join-Path $controls 'node_modules/playwright'
          $playwrightCli = Join-Path $playwright 'cli.js'
          $chart = Join-Path $controls 'node_modules/chart.js/dist/chart.umd.min.js'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'slides-browsers'
          & node $playwrightCli install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & node $playwrightCli install $env:SECONDARY_BROWSER
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $original = 'included/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/references/html-template.md'
          $repaired = 'included/repaired/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/references/html-template.md'
          function Invoke-Control([string] $name, [string[]] $nodeArguments) {
            & node @nodeArguments | Tee-Object -FilePath (Join-Path $results "$name.json")
            if ($LASTEXITCODE -ne 0) { throw "Control failed: $name" }
          }
          foreach ($engine in @('chromium', $env:SECONDARY_BROWSER)) {
            Invoke-Control "labels-$engine" @("$evidence/labels.cjs", $playwright, $original, $repaired, $engine)
            Invoke-Control "motion-$engine" @("$evidence/motion.cjs", $playwright, $original, $repaired, $engine)
            foreach ($layout in @('desktop', 'narrow')) {
              Invoke-Control "navigation-$engine-$layout" @("$evidence/navigation.cjs", $playwright, $original, $repaired, 'playwright-default', $engine, $layout)
            }
            foreach ($layout in @('desktop', 'narrow', 'landscape')) {
              Invoke-Control "chart-$engine-$layout" @("$evidence/chart.cjs", $playwright, $repaired, '4.6.1', $chart, 'playwright-default', $engine, '-', $layout)
            }
            foreach ($layout in @('narrow', 'landscape')) {
              Invoke-Control "overflow-$engine-$layout" @("$evidence/overflow.cjs", $playwright, $original, $repaired, $engine, $layout)
            }
          }
          $files = @(Get-ChildItem -LiteralPath $results -Filter '*.json' -File)
          if ($files.Count -ne 18) { throw "Expected 18 control receipts; found $($files.Count)" }
          foreach ($file in $files) { Get-Content -Raw -LiteralPath $file.FullName | ConvertFrom-Json | Out-Null }
      - name: Retain browser control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slides-controls-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/slides-results
          if-no-files-found: warn
          retention-days: 14
