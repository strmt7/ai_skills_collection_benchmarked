name: Slides navigation compatibility

on:
  push:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'artifacts/repaired-skill-readiness/slides-navigation-v1/**'
      - '.github/workflows/slides-navigation.yml'
      - '.gitattributes'
      - 'tests/test_slides_navigation_repair.py'
  pull_request:
    paths:
      - 'included/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'included/repaired/skills/by-category/documents-spreadsheets-presentations/latest-release-creative/ckm-slides/**'
      - 'artifacts/repaired-skill-readiness/slides-navigation-v1/**'
      - '.github/workflows/slides-navigation.yml'
      - '.gitattributes'
      - 'tests/test_slides_navigation_repair.py'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'

concurrency:
  group: slides-navigation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-controls:
    name: Slide controls (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24.22.3', '26.13.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install pinned controls and exercise real browsers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = 'artifacts/repaired-skill-readiness/slides-navigation-v1/reproduce.py'
          $cache = Join-Path $env:RUNNER_TEMP 'slides-cache'
          $results = Join-Path $env:RUNNER_TEMP 'slides-results'
          $node = (Get-Command node -CommandType Application | Select-Object -First 1).Source
          python $driver --node $node --cache-root $cache --output (Join-Path $results 'prepare') --prepare-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $driver --node $node --cache-root $cache --output (Join-Path $results 'controls') --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain browser control results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slides-controls-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/slides-results
          if-no-files-found: warn
          retention-days: 14
