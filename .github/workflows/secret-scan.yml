name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Secret scan must read full history (fetch-depth: 0 below) but does not need
# to write anywhere. Least-privilege default token per GitHub's secure-use
# guidance: https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install hashed scanner runtime dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-runtime-lock.txt
      - name: Scan branch history for secret-shaped text (in-repo regex + entropy)
        run: python3 tools/check_no_secret_patterns.py --history

      # Second opinion: gitleaks (MIT). Pinned to v8.30.1 with SHA256 verified
      # from the upstream release on 2026-03-21:
      # https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1
      # We avoid gitleaks-action v2 because it requires a commercial licence
      # for non-OSS use; the binary itself stays MIT.
      - name: Install gitleaks (pinned binary, SHA256-verified)
        id: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          echo "binary_sha256=$(sha256sum /usr/local/bin/gitleaks | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Qualify the Gitleaks history gate
        env:
          GITLEAKS_TEST_BINARY: /usr/local/bin/gitleaks
          GITLEAKS_TEST_GIT: /usr/bin/git
          GITLEAKS_TEST_SHA256: ${{ steps.gitleaks.outputs.binary_sha256 }}
        run: python3 tests/test_gitleaks_history_integration.py

      - name: Run gitleaks against Git patch history
        env:
          GITLEAKS_BINARY_SHA256: ${{ steps.gitleaks.outputs.binary_sha256 }}
        run: |
          python3 tools/check_gitleaks_history.py \
            --gitleaks /usr/local/bin/gitleaks \
            --gitleaks-sha256 "$GITLEAKS_BINARY_SHA256" \
            --git /usr/bin/git
