name: Reusable workflow input controls

on:
  push:
    paths:
      - 'benchmarks/component-controls/workflow-call-inputs/**'
      - 'tests/test_workflow_call_input_controls.py'
      - 'included/improved/skills/workflow-call-inputs/**'
      - 'included/skills/by-category/devops-cloud-operations/latest-release-devops/github-actions-generator/**'
      - '.github/workflows/workflow-call-inputs.yml'
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * 4'

concurrency:
  group: workflow-call-inputs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Input-type controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: '3.13.18'
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/workflow-call-inputs-venv
          enable-cache: 'false'
      - name: Check source and maintained workflow inputs
        run: python benchmarks/component-controls/workflow-call-inputs/controls.py --download --output "${{ runner.temp }}/workflow-call-inputs.json"
      - name: Retain observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-call-inputs-${{ matrix.os }}
          path: ${{ runner.temp }}/workflow-call-inputs.json
          if-no-files-found: error
          retention-days: 14
