name: scvi-tools model input controls

on:
  push:
    paths:
      - 'included/repaired/skills/by-category/science-research-data-analysis/latest-release-community/scvi-model-inputs/**'
      - 'artifacts/repaired-skill-readiness/scvi-model-inputs-v1/**'
      - '.github/workflows/scvi-input-controls.yml'
      - '.gitattributes'
  workflow_dispatch:
  schedule:
    - cron: '10 9 * * 2'

concurrency:
  group: scvi-input-controls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  controls:
    name: Synthetic CPU model controls (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          python-version: '3.13.18'
          activate-environment: 'true'
          venv-path: ${{ runner.temp }}/scvi-input-venv
          enable-cache: 'false'
      - name: Install the pinned build and runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import platform,sys; print(platform.python_version()); sys.exit(platform.python_version() != '3.13.18' or sys.prefix == sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --only-binary=:all: --require-hashes -r artifacts/repaired-skill-readiness/scvi-model-inputs-v1/build-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --require-hashes --no-build-isolation -r artifacts/repaired-skill-readiness/scvi-model-inputs-v1/requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the synthetic SCVI and SysVI fits
        shell: pwsh
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-scvi
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib-scvi
          TORCH_HOME: ${{ runner.temp }}/torch-scvi
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          $ErrorActionPreference = 'Stop'
          python artifacts/repaired-skill-readiness/scvi-model-inputs-v1/reproduce.py --output "$env:RUNNER_TEMP/scvi-input-result.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the component result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scvi-input-windows
          path: ${{ runner.temp }}/scvi-input-result.json
          if-no-files-found: error
          retention-days: 14
