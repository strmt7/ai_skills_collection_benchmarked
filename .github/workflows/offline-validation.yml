name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:
  # Catch upstream drift (CVE updates, action deprecations) without waiting
  # for a push: weekly Monday 06:00 UTC, ahead of the Dependabot run.
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded in-progress runs for the same ref so queued pushes do not
# stack up in CI. See the concurrency docs:
# https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token per GitHub's secure-use guidance:
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    # Inherited by checkout's Git processes, including on Windows runners.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      AI_SKILLS_REQUIRE_UV: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11.18", "3.12.16", "3.13.18", "3.14.10"]
        include:
          - os: windows-latest
            python-version: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Record the native control runtime
        run: node --version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install locked test environment
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          subprocess.run([sys.executable, "-m", "venv", ".venv"], check=True)
          bindir = Path(".venv") / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          subprocess.run([sys.executable, "tools/verify_dev_lock.py", "--json"], check=True)
          subprocess.run([
              "uv", "pip", "sync", "--python", str(python), "--no-config",
              "--default-index", "https://pypi.org/simple", "--require-hashes",
              "--only-binary=:all:", "requirements-dev-lock.txt",
          ], check=True)
          subprocess.run([
              "uv", "pip", "install", "--python", str(python), "--no-config",
              "--no-deps", "--no-build-isolation", "--editable", ".",
          ], check=True)
          subprocess.run(["uv", "pip", "check", "--python", str(python)], check=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(f"{bindir.resolve()}\n")
      - name: Validate generated JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path("data/skills_catalog.json").read_text(encoding="utf-8"))
          print(f"Validated {len(data)} catalog records")
      - name: Verify PowerShell native exit-status controls
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "verification-powershell-status.json"
          subprocess.run([
              sys.executable, "benchmarks/dependency-regressions/verification_powershell.py",
              "--output", str(output),
          ], check=True)
      - name: Verify recorded PowerShell control evidence
        run: >-
          python benchmarks/dependency-regressions/verification_powershell.py
          --output artifacts/research/2026-11-03/verification-powershell-status-v1/result.json --check
      - name: Verify recorded Next.js cache control evidence
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          base = Path("artifacts/research/2026-11-03/next-cache-defaults-v1")
          for name in ("windows-result.json", "linux-result.json"):
              subprocess.run([
                  sys.executable, "benchmarks/dependency-regressions/next_turbopack_cache.py",
                  "--output", str(base / name), "--check",
              ], check=True)
      - name: Validate catalog and mirrors
        run: python tools/validate_catalog.py
      - name: Check exact mirror bytes for residual detected material
        run: python tools/check_mirror_content_admission.py --json
      - name: Enforce mandatory agent-tool routing
        run: python tools/validate_agent_tool_policy.py --check --json
      - name: Verify current native qualification and historical source supersessions
        run: python tools/validate_native_qualification_index.py --check --json
      - name: Verify citation URL security overlay
        run: python tools/check_citation_security_overlay.py --check --json
      - name: Verify Key Vault Java security overlay
        run: python tools/check_keyvault_security_overlay.py --check --json
      - name: Validate benchmark and provenance artifacts
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import check_benchmark_artifact

          paths = sorted(Path("artifacts/benchmark-runs").rglob("artifact.json"))
          if not paths:
              raise SystemExit("no benchmark or provenance artifacts recorded")
          for path in paths:
              result = check_benchmark_artifact.validate_artifact(path)
              if result["verdict"] != "artifact_complete":
                  raise SystemExit(f"{path}: {result}")
          print(f"validated {len(paths)} benchmark/provenance artifacts")
          PY
      - name: Validate static benchmark outputs
        run: python tools/run_static_benchmarks.py --check
      - name: Validate skill risk audit
        run: python tools/audit_skill_quality.py --check
      - name: Validate complete improvement coverage and evidence
        run: python tools/manage_improvement_ledger.py --check --json
      - name: Verify the recorded upstream tree comparison
        run: >-
          python artifacts/research/2026-10-28/ecc-source-snapshots/generator.py.txt
          --repo affaan-m/everything-claude-code
          --lock artifacts/research/2026-10-28/ecc-source-snapshots/source-lock.json.gz
          --old-commit artifacts/research/2026-10-28/ecc-source-snapshots/old-commit.json
          --old-tree artifacts/research/2026-10-28/ecc-source-snapshots/old-tree.json.gz
          --new-commit artifacts/research/2026-10-28/ecc-source-snapshots/new-commit.json
          --new-tree artifacts/research/2026-10-28/ecc-source-snapshots/new-tree.json.gz
          --output artifacts/research/2026-10-28/ecc-upstream-tree-delta.json --check
      - name: Verify the recorded Anthropic source comparison
        run: >-
          python artifacts/research/2026-10-28/ecc-source-snapshots/generator.py.txt
          --repo anthropics/skills
          --lock artifacts/research/2026-11-01/anthropic-source-snapshots/source-lock.json.gz
          --old-commit artifacts/research/2026-11-01/anthropic-source-snapshots/old-commit.json
          --old-tree artifacts/research/2026-11-01/anthropic-source-snapshots/old-tree.json.gz
          --new-commit artifacts/research/2026-11-01/anthropic-source-snapshots/new-commit.json
          --new-tree artifacts/research/2026-11-01/anthropic-source-snapshots/new-tree.json.gz
          --output artifacts/research/2026-11-01/anthropic-upstream-tree-delta.json --check
      - name: Verify the recorded scientific skills relocation comparison
        run: >-
          python artifacts/research/2026-10-28/scientific-source-snapshots/generator.py.txt
          --repo K-Dense-AI/scientific-agent-skills
          --lock artifacts/research/2026-10-28/scientific-source-snapshots/source-lock.json.gz
          --old-commit artifacts/research/2026-10-28/scientific-source-snapshots/old-commit.json
          --old-tree artifacts/research/2026-10-28/scientific-source-snapshots/old-tree.json.gz
          --new-commit artifacts/research/2026-10-28/scientific-source-snapshots/new-commit.json
          --new-tree artifacts/research/2026-10-28/scientific-source-snapshots/new-tree.json.gz
          --relocate scientific-skills skills
          --release artifacts/research/2026-10-28/scientific-source-snapshots/latest-release.json
          --tag artifacts/research/2026-10-28/scientific-source-snapshots/new-tag.json
          --output artifacts/research/2026-10-28/scientific-upstream-relocation-delta.json --check
      - name: Verify native workflow evaluator controls and retained misses
        run: python tools/report_workflow_evaluator_controls.py --check --json
      - name: Validate improved overlays and original provenance
        run: python tools/validate_improved_skills.py --json
      - name: Verify frontend component control evidence and input freshness
        run: python benchmarks/component-controls/frontend/prepare.py --check
      - name: Verify API and backend component evidence and input freshness
        run: python benchmarks/component-controls/backend/prepare_backend.py --check
      - name: Verify native fuzzing evidence and collector input freshness
        run: python benchmarks/component-controls/native-testing/run_native.py --check
      - name: Verify confined evaluator evidence and source freshness
        run: python tools/qualify_appcontainer.py --check
      - name: Verify all matched development trials and report
        run: >-
          python tools/summarize_agent_trials.py
          --protocol benchmarks/agent-effectiveness/development/protocol-v2.json
          --trials artifacts/agent-trials/development-v2
          --output-dir artifacts/agent-trials/development-v2-report --check --json
      - name: Verify frozen public development task selection
        run: >-
          python tools/select_swe_skills_tasks.py
          --frame artifacts/research/2026-11-11/swe-skills-bench-archive/frame.json
          --exclusions benchmarks/agent-effectiveness/development/swe-skills-pilot-v1/exclusions.json
          --seed f658aca6273493e179b592e650341bc2cf76b1c48002633e592ab68c6cef212b
          --tasks 12
          --output benchmarks/agent-effectiveness/development/swe-skills-pilot-v1/selection.json
          --check
      - name: Run tests (with coverage)
        run: python -m pytest -q -n auto
      - name: Upload coverage.xml
        if: always()
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Compile Python
        run: python -m compileall -q tools tests benchmarks/agent-effectiveness/graders

  latest-test-dependencies:
    name: Latest compatible test dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      AI_SKILLS_REQUIRE_UV: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11.18", "3.12.16", "3.13.18", "3.14.10"]
        include:
          - os: windows-latest
            python-version: "3.14.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
      - name: Install latest compatible test dependencies
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          subprocess.run([sys.executable, "-m", "venv", ".venv"], check=True)
          bindir = Path(".venv") / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          subprocess.run([
              "uv", "pip", "install", "--python", str(python), "--no-config",
              "--default-index", "https://pypi.org/simple", "--editable", ".[test]",
          ], check=True)
          subprocess.run(["uv", "pip", "check", "--python", str(python)], check=True)
          subprocess.run(["uv", "pip", "freeze", "--python", str(python)], check=True)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
              output.write(f"{bindir.resolve()}\n")
      - name: Run tests against latest compatible dependencies
        run: python -m pytest -q -n auto

  coverage:
    needs: validate
    # Uploads from fork pull requests require a separate trust decision.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Codecov verifies this repository through GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install hashed coverage parser
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-coverage-lock.txt
      - name: Retrieve measured reports from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Validate complete coverage bundle against current tools
        id: bundle
        run: >-
          python tools/validate_coverage_bundle.py --directory coverage-reports
          --expected-reports 5 --output coverage-bundle.json
          --github-output "$GITHUB_OUTPUT" --json
      - name: Upload measured Python tooling coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          cleanup: true
          files: ${{ steps.bundle.outputs.files }}
          flags: python_tooling
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
          version: v11.3.1
      - name: Retain source-bound coverage receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-coverage-receipt
          path: coverage-bundle.json
          if-no-files-found: error
          retention-days: 14

  frontend-controls:
    name: Native component controls (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: benchmarks/component-controls/frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Provision isolated pinned npm and frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $npmRoot = Join-Path $env:RUNNER_TEMP 'frontend-npm'
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          New-Item -ItemType Directory -Path $dependencyRoot | Out-Null
          Copy-Item benchmarks/component-controls/frontend/package*.json -Destination $dependencyRoot
          npm install --prefix $npmRoot --ignore-scripts --no-audit --no-fund npm@12.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmCli = Join-Path $npmRoot 'node_modules/npm/bin/npm-cli.js'
          node $npmCli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli ci --prefix $dependencyRoot --ignore-scripts --strict-peer-deps --engine-strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli ls --prefix $dependencyRoot --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli audit --prefix $dependencyRoot --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rerun source-bound component and lifecycle controls
        shell: pwsh
        run: |
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          python benchmarks/component-controls/frontend/run_native.py --node (Get-Command node).Source --dependency-root $dependencyRoot --workspace (Join-Path $dependencyRoot 'controls') --output (Join-Path $env:RUNNER_TEMP 'frontend-observations')
          exit $LASTEXITCODE
      - name: Upload actual component observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-component-controls-windows
          path: ${{ runner.temp }}/frontend-observations
          if-no-files-found: error
          retention-days: 14
      - name: Rerun API and backend component controls
        shell: pwsh
        run: |
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          python benchmarks/component-controls/backend/run_backend_native.py --node (Get-Command node).Source --go (Get-Command go).Source --dependency-root $dependencyRoot --workspace (Join-Path $dependencyRoot 'backend-controls') --output (Join-Path $env:RUNNER_TEMP 'backend-observations')
          exit $LASTEXITCODE
      - name: Upload actual API and backend observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-component-controls-windows
          path: ${{ runner.temp }}/backend-observations
          if-no-files-found: error
          retention-days: 14

  report-compatibility:
    name: Report compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
      PYTHONPATH: tools
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11.18", "3.12.16", "3.13.18", "3.14.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ runner.os != 'Windows' || startsWith(matrix.python-version, '3.14.') }}
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ runner.os == 'Windows' && !startsWith(matrix.python-version, '3.14.') }}
        with:
          version: "0.13.8"
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          venv-path: ${{ runner.temp }}/report-compatibility-venv
          enable-cache: "false"
      - name: Install pip in the managed Python environment
        if: ${{ runner.os == 'Windows' && !startsWith(matrix.python-version, '3.14.') }}
        run: uv pip install 'pip==26.3'
      - name: Verify the selected Python version
        shell: python
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          import os
          import platform
          actual = platform.python_version()
          expected = os.environ["EXPECTED_PYTHON"]
          if actual != expected:
              raise SystemExit(f"Expected Python {expected}; got {actual}")
          print(f"Verified Python {actual}")
      - name: Install report dependencies
        run: python -m pip install '.[reports]'
      - name: Test report rendering
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python -m unittest discover -s tests -p 'test_render_*chart.py'
      - name: Render verified historical comparisons
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python tools/summarize_agent_trials.py --protocol benchmarks/agent-effectiveness/development/protocol-v2.json --trials artifacts/agent-trials/development-v2 --output-dir "$RUNNER_TEMP/report-compatibility" --plots --json
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/report-compatibility/task-differences.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/report-compatibility/task-differences.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --view paired --output "$RUNNER_TEMP/report-compatibility/paired-outcomes.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --view paired --output "$RUNNER_TEMP/report-compatibility/paired-outcomes.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --output "$RUNNER_TEMP/report-compatibility/karpathy-differences.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --output "$RUNNER_TEMP/report-compatibility/karpathy-differences.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --view paired --output "$RUNNER_TEMP/report-compatibility/karpathy-paired.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --view paired --output "$RUNNER_TEMP/report-compatibility/karpathy-paired.svg" --check
          python tools/render_token_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/report-compatibility/token-differences.svg"
          python tools/render_token_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/report-compatibility/token-differences.svg" --check
      - name: Verify published single-task charts
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: >-
          python tools/summarize_agent_trials.py
          --protocol benchmarks/agent-effectiveness/development/protocol-v2.json
          --trials artifacts/agent-trials/development-v2
          --output-dir artifacts/agent-trials/development-v2-report
          --check --check-plots --json

  trial-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install hashed report dependencies
        run: python -m pip install --require-hashes -r requirements-reports-lock.txt
      - name: Reverify and render recorded comparisons
        run: >-
          python tools/summarize_agent_trials.py
          --protocol benchmarks/agent-effectiveness/development/protocol-v2.json
          --trials artifacts/agent-trials/development-v2
          --output-dir "$RUNNER_TEMP/matched-development-report" --plots --json
      - name: Test and render task-weighted comparison
        env:
          PYTHONPATH: tools
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          python -c "import matplotlib; print('Matplotlib', matplotlib.__version__)"
          python -m unittest discover -s tests -p test_render_multi_task_chart.py
          python -m unittest discover -s tests -p test_render_token_chart.py
          python tools/summarize_multi_task_trials.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json > "$RUNNER_TEMP/matched-development-report/multi-task-summary.json"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/matched-development-report/task-differences.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/matched-development-report/task-differences.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --view paired --output "$RUNNER_TEMP/matched-development-report/paired-outcomes.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --view paired --output "$RUNNER_TEMP/matched-development-report/paired-outcomes.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --output "$RUNNER_TEMP/matched-development-report/karpathy-differences.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --output "$RUNNER_TEMP/matched-development-report/karpathy-differences.svg" --check
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --view paired --output "$RUNNER_TEMP/matched-development-report/karpathy-paired.svg"
          python tools/render_multi_task_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --baseline karpathy --view paired --output "$RUNNER_TEMP/matched-development-report/karpathy-paired.svg" --check
          python tools/render_token_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/matched-development-report/token-differences.svg"
          python tools/render_token_chart.py --plan benchmarks/agent-effectiveness/development/multi-task-historical-example.json --output "$RUNNER_TEMP/matched-development-report/token-differences.svg" --check
      - name: Upload verified tables and graphs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matched-development-report
          path: ${{ runner.temp }}/matched-development-report
          if-no-files-found: error
          retention-days: 30

  docs-extractor-controls:
    name: Documentation extractor regression controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Pull pinned isolated runtime
        run: docker pull python@sha256:89fb7d3da20043c370643435258bdd7ab755d326d359001d02988ed15ae5219e
      - name: Reproduce source-bound extractor defects
        run: >-
          python benchmarks/dependency-regressions/docs_from_code_controls.py
          --output "$RUNNER_TEMP/docs-from-code-controls.json"
      - name: Retain control receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-from-code-controls
          path: ${{ runner.temp }}/docs-from-code-controls.json
          if-no-files-found: error
          retention-days: 14

  stable-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install hashed audit dependencies
        run: python -m pip install --require-hashes -r requirements-reports-lock.txt
      - name: Recheck latest stable release commits against workflow pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/audit_workflow_versions.py
          --output "$RUNNER_TEMP/workflow-stable-versions.json"
          --observed-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json
