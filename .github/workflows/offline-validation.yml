name: Offline validation

on:
  push:
  pull_request:
  workflow_dispatch:
  # Catch upstream drift (CVE updates, action deprecations) without waiting
  # for a push: weekly Monday 06:00 UTC, ahead of the Dependabot run.
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded in-progress runs for the same ref so queued pushes do not
# stack up in CI. See the concurrency docs:
# https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
concurrency:
  group: offline-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token per GitHub's secure-use guidance:
# https://docs.github.com/en/actions/reference/security/secure-use
permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    # Inherited by checkout's Git processes, including on Windows runners.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11.17", "3.12.15", "3.13.17", "3.14.9"]
        include:
          - os: windows-latest
            python-version: "3.14.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Validate generated JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path("data/skills_catalog.json").read_text(encoding="utf-8"))
          print(f"Validated {len(data)} catalog records")
      - name: Validate catalog and mirrors
        run: python tools/validate_catalog.py
      - name: Check exact mirror bytes for residual detected material
        run: python tools/check_mirror_content_admission.py --json
      - name: Enforce mandatory agent-tool routing
        run: python tools/validate_agent_tool_policy.py --check --json
      - name: Verify citation URL security overlay
        run: python tools/check_citation_security_overlay.py --check --json
      - name: Verify Key Vault Java security overlay
        run: python tools/check_keyvault_security_overlay.py --check --json
      - name: Validate benchmark and provenance artifacts
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools")
          import check_benchmark_artifact

          paths = sorted(Path("artifacts/benchmark-runs").rglob("artifact.json"))
          if not paths:
              raise SystemExit("no benchmark or provenance artifacts recorded")
          for path in paths:
              result = check_benchmark_artifact.validate_artifact(path)
              if result["verdict"] != "artifact_complete":
                  raise SystemExit(f"{path}: {result}")
          print(f"validated {len(paths)} benchmark/provenance artifacts")
          PY
      - name: Validate static benchmark outputs
        run: python tools/run_static_benchmarks.py --check
      - name: Validate skill risk audit
        run: python tools/audit_skill_quality.py --check
      - name: Validate complete improvement coverage and evidence
        run: python tools/manage_improvement_ledger.py --check --json
      - name: Verify the recorded upstream tree comparison
        run: >-
          python artifacts/research/2026-10-28/ecc-source-snapshots/generator.py.txt
          --repo affaan-m/everything-claude-code
          --lock artifacts/research/2026-10-28/ecc-source-snapshots/source-lock.json.gz
          --old-commit artifacts/research/2026-10-28/ecc-source-snapshots/old-commit.json
          --old-tree artifacts/research/2026-10-28/ecc-source-snapshots/old-tree.json.gz
          --new-commit artifacts/research/2026-10-28/ecc-source-snapshots/new-commit.json
          --new-tree artifacts/research/2026-10-28/ecc-source-snapshots/new-tree.json.gz
          --output artifacts/research/2026-10-28/ecc-upstream-tree-delta.json --check
      - name: Verify the recorded scientific skills relocation comparison
        run: >-
          python artifacts/research/2026-10-28/scientific-source-snapshots/generator.py.txt
          --repo K-Dense-AI/scientific-agent-skills
          --lock artifacts/research/2026-10-28/scientific-source-snapshots/source-lock.json.gz
          --old-commit artifacts/research/2026-10-28/scientific-source-snapshots/old-commit.json
          --old-tree artifacts/research/2026-10-28/scientific-source-snapshots/old-tree.json.gz
          --new-commit artifacts/research/2026-10-28/scientific-source-snapshots/new-commit.json
          --new-tree artifacts/research/2026-10-28/scientific-source-snapshots/new-tree.json.gz
          --relocate scientific-skills skills
          --release artifacts/research/2026-10-28/scientific-source-snapshots/latest-release.json
          --tag artifacts/research/2026-10-28/scientific-source-snapshots/new-tag.json
          --output artifacts/research/2026-10-28/scientific-upstream-relocation-delta.json --check
      - name: Verify native workflow evaluator controls and retained misses
        run: python tools/report_workflow_evaluator_controls.py --check --json
      - name: Validate improved overlays and original provenance
        run: python tools/validate_improved_skills.py --json
      - name: Verify frontend component control evidence and input freshness
        run: python benchmarks/component-controls/frontend/prepare.py --check
      - name: Verify API and backend component evidence and input freshness
        run: python benchmarks/component-controls/backend/prepare_backend.py --check
      - name: Verify native fuzzing evidence and collector input freshness
        run: python benchmarks/component-controls/native-testing/run_native.py --check
      - name: Verify confined evaluator evidence and source freshness
        run: python tools/qualify_appcontainer.py --check
      - name: Verify all matched development trials and report
        run: >-
          python tools/summarize_agent_trials.py
          --protocol benchmarks/agent-effectiveness/development/protocol-v2.json
          --trials artifacts/agent-trials/development-v2
          --output-dir artifacts/agent-trials/development-v2-report --check --json
      - name: Run tests (with coverage)
        run: python -m pytest -q -n auto
      - name: Upload coverage.xml
        if: always()
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Compile Python
        run: python -m compileall -q tools tests benchmarks/agent-effectiveness/graders

  coverage:
    needs: validate
    # Uploads from fork pull requests require a separate trust decision.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Codecov verifies this repository through GitHub OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Install hashed coverage parser
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-coverage-lock.txt
      - name: Retrieve measured reports from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-reports
      - name: Validate complete coverage bundle against current tools
        id: bundle
        run: >-
          python tools/validate_coverage_bundle.py --directory coverage-reports
          --expected-reports 5 --output coverage-bundle.json
          --github-output "$GITHUB_OUTPUT" --json
      - name: Upload measured Python tooling coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          cleanup: true
          files: ${{ steps.bundle.outputs.files }}
          flags: python_tooling
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
          version: v11.3.1
      - name: Retain source-bound coverage receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-tooling-coverage-receipt
          path: coverage-bundle.json
          if-no-files-found: error
          retention-days: 14

  frontend-controls:
    name: Native component controls (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          cache: npm
          cache-dependency-path: benchmarks/component-controls/frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Provision isolated pinned npm and frontend dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $npmRoot = Join-Path $env:RUNNER_TEMP 'frontend-npm'
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          New-Item -ItemType Directory -Path $dependencyRoot | Out-Null
          Copy-Item benchmarks/component-controls/frontend/package*.json -Destination $dependencyRoot
          npm install --prefix $npmRoot --ignore-scripts --no-audit --no-fund npm@12.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmCli = Join-Path $npmRoot 'node_modules/npm/bin/npm-cli.js'
          node $npmCli --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli ci --prefix $dependencyRoot --ignore-scripts --strict-peer-deps --engine-strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli ls --prefix $dependencyRoot --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $npmCli audit --prefix $dependencyRoot --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rerun source-bound component and lifecycle controls
        shell: pwsh
        run: |
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          python benchmarks/component-controls/frontend/run_native.py --node (Get-Command node).Source --dependency-root $dependencyRoot --workspace (Join-Path $dependencyRoot 'controls') --output (Join-Path $env:RUNNER_TEMP 'frontend-observations')
          exit $LASTEXITCODE
      - name: Upload actual component observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-component-controls-windows
          path: ${{ runner.temp }}/frontend-observations
          if-no-files-found: error
          retention-days: 14
      - name: Rerun API and backend component controls
        shell: pwsh
        run: |
          $dependencyRoot = Join-Path $env:RUNNER_TEMP 'frontend-dependencies'
          python benchmarks/component-controls/backend/run_backend_native.py --node (Get-Command node).Source --go (Get-Command go).Source --dependency-root $dependencyRoot --workspace (Join-Path $dependencyRoot 'backend-controls') --output (Join-Path $env:RUNNER_TEMP 'backend-observations')
          exit $LASTEXITCODE
      - name: Upload actual API and backend observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-component-controls-windows
          path: ${{ runner.temp }}/backend-observations
          if-no-files-found: error
          retention-days: 14

  trial-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Install hashed report dependencies
        run: python -m pip install --require-hashes -r requirements-reports-lock.txt
      - name: Reverify and render recorded comparisons
        run: >-
          python tools/summarize_agent_trials.py
          --protocol benchmarks/agent-effectiveness/development/protocol-v2.json
          --trials artifacts/agent-trials/development-v2
          --output-dir "$RUNNER_TEMP/matched-development-report" --plots --json
      - name: Upload verified tables and graphs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matched-development-report
          path: ${{ runner.temp }}/matched-development-report
          if-no-files-found: error
          retention-days: 30

  docs-extractor-controls:
    name: Documentation extractor regression controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Pull pinned isolated runtime
        run: docker pull python@sha256:89fb7d3da20043c370643435258bdd7ab755d326d359001d02988ed15ae5219e
      - name: Reproduce source-bound extractor defects
        run: >-
          python benchmarks/dependency-regressions/docs_from_code_controls.py
          --output "$RUNNER_TEMP/docs-from-code-controls.json"
      - name: Retain control receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-from-code-controls
          path: ${{ runner.temp }}/docs-from-code-controls.json
          if-no-files-found: error
          retention-days: 14

  stable-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.9"
      - name: Install hashed audit dependencies
        run: python -m pip install --require-hashes -r requirements-reports-lock.txt
      - name: Recheck latest stable release commits against workflow pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/audit_workflow_versions.py
          --output "$RUNNER_TEMP/workflow-stable-versions.json"
          --observed-at-utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --json
