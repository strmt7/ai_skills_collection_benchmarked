# Local quality gates mirroring the CI workflow set. Install with:
#   pip install -e '.[lint,security]' && pre-commit install
#
# Hook versions are pinned and maintained on main; automatic dependency-update
# pull requests are disabled (see .github/dependabot.yml).

default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # v2.4.1
    hooks:
      - id: mypy
        files: ^(tools/|tests/|benchmarks/agent-effectiveness/graders/)
        additional_dependencies:
          - PyYAML==6.0.4
          - types-PyYAML==6.0.12.20261122
          - pytest==9.2.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        # Skip generated catalog JSON (validated by tools/validate_catalog.py).
        exclude: "^(data/skills_catalog\\.json|data/benchmark_scenarios\\.json|included/.*\\.json|artifacts/.*\\.json)$"
      - id: end-of-file-fixer
        exclude: "^(included/|artifacts/|data/|docs/)"
      - id: trailing-whitespace
        exclude: "^(included/|artifacts/|docs/.*\\.md)"
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: "^(included/|artifacts/)"

  - repo: local
    hooks:
      - id: in-repo-secret-scan
        name: in-repo secret scan (fast)
        entry: python3 tools/check_no_secret_patterns.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
